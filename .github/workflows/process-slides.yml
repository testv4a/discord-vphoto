name: Process Discord Slides

on:
  push:
    branches: [main]
    paths:
      - "queue/**"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: discord-vrc-slideshow-content
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Process queue
        id: process
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/manage_slides.py

      - name: Commit generated files
        if: steps.process.outputs.repository_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs queue data
          git commit -m "Update slideshow revision ${{ steps.process.outputs.revision }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure Pages
        if: steps.process.outputs.content_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.process.outputs.content_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        if: steps.process.outputs.content_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: always() && steps.process.outcome == 'success'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python tools/notify_discord.py \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --deploy-status "${{ steps.deployment.outcome }}"
